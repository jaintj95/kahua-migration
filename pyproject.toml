[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kahua-migration"
version = "0.1.0"
description = "Auditable, resumable PlanGrid drawing migration to Kahua"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
ocr = ["Pillow>=10,<13"]

[project.scripts]
kahua-migrate = "kahua_migration.cli:main"

[tool.setuptools.packages.find]
include = ["kahua_migration*"]
