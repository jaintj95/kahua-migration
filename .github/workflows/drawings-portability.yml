name: Drawings portability fixtures

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'kahua_migration/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/drawings-portability.yml'
  pull_request:
    paths:
      - 'kahua_migration/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/drawings-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native offline OCR and browser dependencies
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ProgramFiles\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip install -e ".[browser,ocr]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Only synthetic images, intercepted HTML, localhost HTTP and temp files.
      # No Kahua account, Windows devbox, credentials or real migration inputs.
      - name: Test native OCR, Chrome fixtures and journal regression suite
        env:
          KAHUA_OCR_TESTS: '1'
          KAHUA_BROWSER_TESTS: '1'
          KAHUA_TEST_OCR_BACKEND: tesseract
        run: python -m unittest discover -s tests -v
